name: Generate Java Stubs

on:
  # Run when JAR files are updated (branch pushes only - a tag push cannot be
  # committed back to)
  push:
    branches:
      - '**'
    paths:
      - 'src/neqsim/lib/*.jar'
  # Run on release
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:

# A push to master and a release publish commonly fire together (a release
# also pushes the tagged commit), giving two concurrent runs targeting the
# same branch. Queue them instead of letting both auto-commit-and-push race,
# which fails the second push with "non-fast-forward".
concurrency:
  group: generate-stubs-${{ (github.event_name == 'release' && github.event.repository.default_branch) || github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  generate-stubs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out a branch (not a detached HEAD SHA or tag) so the
          # auto-commit step below has a branch to push back to. On a release
          # event github.ref_name is the tag, so fall back to the default branch.
          ref: ${{ (github.event_name == 'release' && github.event.repository.default_branch) || github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Generate stubs
        run: |
          uv run python scripts/generate_stubs.py

      - name: Generate offline API manifest
        run: |
          uv run python scripts/generate_api_manifest.py

      - name: Commit updated stubs and manifest
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate Java stubs and API manifest"
          file_pattern: "src/jneqsim-stubs/**/*.pyi src/neqsim/data/neqsim_api.json.gz"
