# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        exclude: ^conda/meta\.yaml$
    -   id: check-added-large-files
-   repo: https://github.com/psf/black
    # Keep this in sync with the black version in pyproject.toml's dev group
    # (black>=26.0,<27.0). A mismatch causes local pre-commit formatting to
    # differ from the CI check and makes files drift out of format.
    rev: 26.5.1
    hooks:
    -   id: black
        # Java API stubs are generated artifacts owned by stubgenj. Some Java-
        # derived names are not valid Python syntax and cannot be parsed by Black.
        exclude: ^src/(jneqsim|jpype)-stubs/
